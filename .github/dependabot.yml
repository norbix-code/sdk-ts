# Dependabot keeps the SDK's npm dependencies and GitHub Actions versions
# fresh. CVE patches arrive out-of-band from the weekly cadence below.
#
# Two ecosystems are watched:
#   - npm:             package.json at repo root
#   - github-actions:  every `uses:` in .github/workflows/*

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      semantic-release:
        patterns:
          - 'semantic-release'
          - '@semantic-release/*'
      # vitest and @vitest/* pin each other as exact peers, so a lone bump
      # fails `npm ci` with ERESOLVE.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # TypeScript 7 (native port): @typescript-eslint 8.x peers on
      # typescript <6.1.0. Drop once typescript-eslint supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # v10 needs conventional-changelog-writer@9, but
      # @semantic-release/release-notes-generator@14 still ships writer 8
      # (see the 9.3.1 pin). Drop once release-notes-generator moves to 9.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
