# Dependabot keeps the SDK's npm dependencies and GitHub Actions versions
# fresh. CVE patches arrive out-of-band from the weekly cadence below.
#
# Two ecosystems are watched:
#   - npm:             package.json at repo root
#   - github-actions:  every `uses:` in .github/workflows/*

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    ignore:
      # eslint-plugin-import does not yet declare peer support for ESLint 10.
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: eslint-config-prettier
        versions: ['>=10']
      # Stay on TS 5 until we explicitly adopt the TS 6 toolchain.
      - dependency-name: typescript
        versions: ['>=6']
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      semantic-release:
        patterns:
          - 'semantic-release'
          - '@semantic-release/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
